# 本地 35B / Qwen2.5-32B-Instruct @ AMD RX 7900 XT 20GB
# 目标任务：Context Unit → Semantic Envelope 的 JSON SFT
#
# 先读这段再训：
# - 50 条评测样本不够做 LoRA。先用 semantic_extract_prompt.md 零样本/少样本抽，
#   人工修订成金标，攒到 ≥800 条（建议 1500，10% 作 valid）再启动本配置。
# - 7900 XT 20GB 训 32B 只能 QLoRA 4-bit + batch=1 + checkpointing。
#   全参或 r=64 会直接 OOM。
# - ROCm 没有官方 Unsloth，用 PEFT + transformers + bitsandbytes(ROCm) 或 LLaMA-Factory。
# - 不要拿未重切的 12 条超长窗当训练输入，否则模型学会把多事件揉进一张 envelope。

training_config:
  base_model: "Qwen/Qwen2.5-32B-Instruct"
  tokenizer: "Qwen/Qwen2.5-32B-Instruct"
  output_dir: "./models/kol_semantic_lora"
  task_type: "CAUSAL_LM"
  quantization: "nf4"
  double_quant: true
  compute_dtype: "bfloat16"
  trust_remote_code: true

data:
  train_file: "./data/sft/sft_extract_train.jsonl"
  valid_file: "./data/sft/sft_extract_valid.jsonl"
  # 每行: {"messages":[{"role":"system","content":...},{"role":"user","content":...},{"role":"assistant","content":"<json>"}]}
  packing: true
  min_gold_rows: 800
  valid_ratio: 0.1
  max_samples_until_gold_ready: 0   # 金标不足时禁止开训

lora_hyperparameters:
  r: 16
  lora_alpha: 32          # alpha = 2r
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  # OOM 回退：只留 q_proj k_proj v_proj o_proj，r 降到 8

training_arguments:
  learning_rate: 1.0e-4          # 4-bit 32B 不要用 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 2            # 800–1500 条用 2；<800 禁止靠加 epoch 硬记
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16  # 有效 batch = 16
  max_seq_length: 1536             # 切窗改短之后够用；OOM 再降到 1280
  bf16: true
  fp16: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  optim: "paged_adamw_8bit"
  weight_decay: 0.0
  max_grad_norm: 0.3
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: "none"
  dataloader_num_workers: 2
  seed: 42

inference_after_sft:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 700
  stop: ["\n\n\n"]
  json_mode: true
  reject_if_not_json: true

rocm_7900xt:
  hip_visible_devices: "0"
  vram_gb: 20
  expected_peak_vram_gb: 18.5
  oom_fallback:
    r: 8
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    max_seq_length: 1280
    gradient_accumulation_steps: 32

eval_gates:
  # 达到这些再考虑把 LoRA 接到生产抽取
  json_valid_rate: 0.98
  action_exact_match: 0.75      # ticker+action+price 三元组
  fabricated_field_rate: 0.02   # 金标没有却被模型写出的价格/ticker
  failed_when_should_fail: 0.90 # 缺标的样本必须 failed

curriculum:
  stage_0_prompt_only: "用 semantic_extract_prompt.md 抽 50 条并人工改"
  stage_1_gold_200: "只评估，不开 LoRA"
  stage_2_gold_800: "按本文件训 2 epoch，看 eval_gates"
  stage_3_gold_2000: "可把 r 升到 32，仍保持 4-bit"
