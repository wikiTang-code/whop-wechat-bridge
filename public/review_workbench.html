<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L2 人机协同跟单审核工作台 (离线只读 / 人工待审)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #238636;
      --yellow: #d29922;
      --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 18px; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .date-select { background: #21262d; border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 13px; outline: none; }
    .btn-reload { background: #21262d; border: 1px solid var(--border); color: var(--accent); padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .btn-reload:hover { background: #30363d; }
    .batch-badge { font-size: 11px; background: rgba(88, 166, 255, 0.1); color: var(--accent); padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(88, 166, 255, 0.2); }
    .status-banner { font-size: 11px; background: rgba(210, 153, 34, 0.15); color: var(--yellow); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--yellow); }
    
    .grid-container { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; height: calc(100vh - 90px); }
    .column { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
    .column-header { padding: 12px; background: #1c2128; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; }
    .column-body { padding: 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    /* 卡片通用样式 */
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 13px; transition: border 0.15s; }
    .card:hover { border-color: var(--accent); }
    .card.active { border-color: var(--accent); background: rgba(88, 166, 255, 0.05); }
    .card-title { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
    .card-meta { color: var(--text-muted); font-size: 11px; margin-bottom: 6px; }
    
    /* 状态徽章 */
    .tag { padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .tag-speech-filled { background: rgba(56, 139, 253, 0.15); color: #58a6ff; border: 1px solid #388bfd; }
    .tag-planned { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid #d29922; }
    .tag-dismissed { background: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid #8b949e; }
    .tag-verified { background: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid #3fb950; }
    .tag-failed { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; }
    .tag-kid { background: rgba(163, 113, 247, 0.15); color: #bc8cff; border: 1px solid #a371f7; }
    .tag-empty-view { background: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid #8b949e; }
    
    /* 空窗/已忽略灰卡 */
    .card-empty-view { background: #12161c; border: 1px dashed #30363d; opacity: 0.85; }
    .card-empty-view:hover { border-color: #8b949e; opacity: 1; }
    .card-dismissed { background: #12161c; border: 1px solid #21262d; opacity: 0.65; }
    .card-dismissed:hover { opacity: 0.9; }
    .card.flash-highlight { animation: highlight-pulse 1.5s ease-out; }
    @keyframes highlight-pulse {
      0% { border-color: #f2cc60; box-shadow: 0 0 12px rgba(242, 204, 96, 0.5); }
      100% { border-color: var(--border); box-shadow: none; }
    }
    
    /* 操作按钮 */
    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .btn { flex: 1; padding: 6px; border-radius: 4px; border: none; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-ack { background: var(--green); color: #fff; }
    .btn-dismiss { background: #30363d; color: var(--text); }
    .btn:hover { opacity: 0.9; }
    
    details { background: #12161c; border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-top: 8px; font-size: 12px; }
    summary { cursor: pointer; color: var(--text-muted); font-weight: bold; outline: none; }

    /* 移动端响应式优化 (避免三列挤成竖排) */
    @media (max-width: 850px) {
      body { padding: 8px; }
      .grid-container {
        display: flex;
        flex-direction: column;
        height: auto;
        gap: 12px;
      }
      .column {
        height: 480px;
        min-width: 100%;
      }
      .header-controls {
        width: 100%;
        justify-content: flex-start;
      }
      .card-title {
        flex-direction: row;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🛡️ L2 人机协同跟单审核工作台</h1>
    <div class="header-controls">
      <span class="batch-badge" id="batch-status-text">基础库存: 2026-06-26 | 增量批次: 无</span>
      <button class="btn-reload" onclick="reloadOfflineBatch()" title="重新读取已落盘的最新离线批次指针 (秒级完成，不调大模型)">🔄 同步到最新离线批次</button>
      <label style="font-size: 12px; color: var(--text-muted); margin-left: 6px;">选择美东日期:</label>
      <select id="date-picker" class="date-select" onchange="onDateChanged(this.value)"></select>
      <span id="date-summary-badge" class="batch-badge" style="background: rgba(56, 139, 253, 0.15); color: #58a6ff; font-weight: normal;">📅 当日 CU: 0 (动作: 0, 空窗: 0)</span>
      <div class="status-banner">🛑 券商对账: exit code 2 (阻断中·零实盘挂单)</div>
    </div>
  </header>

  <div class="grid-container">
    
    <!-- 第一列: L2a 口播动作流 -->
    <div class="column">
      <div class="column-header">
        <span>1. L2a 口播动作流</span>
        <span id="stream-count" style="color: var(--accent);">0 项</span>
      </div>
      <div class="column-body" id="l2a-stream-list"></div>
    </div>

    <!-- 第二列: 人工待审确认池 -->
    <div class="column">
      <div class="column-header">
        <span>2. 人工待审池 (当日 Planned + 硬动词)</span>
        <span id="queue-count" style="color: var(--yellow);">0 待审</span>
      </div>
      <div class="column-body" id="review-queue-list"></div>
    </div>

    <!-- 第三列: L2b 战法与风控闸门 -->
    <div class="column">
      <div class="column-header">
        <span>3. L2b 战法与风控闸门</span>
        <span id="gates-scope-badge" style="color: #bc8cff;">当日战法 (0条)</span>
      </div>
      <div class="column-body" id="l2b-gates-list"></div>
    </div>

  </div>

  <script>
    let currentDate = '2026-06-26';
    let selectedCuId = null;
    let allDateStats = {};

    async function initWorkbench() {
      await updateIncrementalStatus();
      await initDates();
    }

    async function updateIncrementalStatus() {
      try {
        const res = await fetch('/api/pipeline/queue-status');
        const data = await res.json();
        const badge = document.getElementById('batch-status-text');
        if (data.badge_summary) {
          badge.innerText = `🌊 ${data.badge_summary}`;
          badge.style.color = '#3fb950';
        }
      } catch (e) {
        console.error("获取流水线状态失败:", e);
      }
    }

    async function reloadOfflineBatch() {
      try {
        const btn = document.querySelector('.btn-reload');
        btn.innerText = '⏳ 正在读取指针...';
        const res = await fetch('/api/l2a/reload-offline', { method: 'POST' });
        const data = await res.json();
        btn.innerText = '🔄 同步到最新离线批次';
        
        alert(data.message + `\n总 CU 数量: ${data.total_cus}`);
        await updateIncrementalStatus();
        await initDates();
      } catch (e) {
        alert("读取批次失败: " + e.message);
      }
    }

    async function initDates() {
      try {
        const res = await fetch('/api/l2a/dates');
        const data = await res.json();
        const picker = document.getElementById('date-picker');
        picker.innerHTML = '';
        allDateStats = data.date_stats || {};
        
        data.dates.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.innerText = d;
          if (d === data.default_date) opt.selected = true;
          picker.appendChild(opt);
        });

        if (data.unknown_date_cu_count > 0) {
          const unkOpt = document.createElement('option');
          unkOpt.value = 'unknown';
          unkOpt.innerText = `未标日期 (${data.unknown_date_cu_count} 条)`;
          picker.appendChild(unkOpt);
        }

        currentDate = data.default_date || '2026-06-26';
        updateDateSummaryBadge(currentDate);
        loadDayData(currentDate);
      } catch (e) {
        console.error("加载日期列表失败:", e);
      }
    }

    function updateDateSummaryBadge(date) {
      const badge = document.getElementById('date-summary-badge');
      const stat = allDateStats[date];
      if (stat) {
        badge.innerText = `📅 当日原始 CU: ${stat.cu_count} 窗 (动作窗: ${stat.action_cu_count}, 纯观点窗: ${stat.empty_cu_count})`;
      } else {
        badge.innerText = `📅 当日 CU 统计: -`;
      }
    }

    function onDateChanged(newDate) {
      currentDate = newDate;
      selectedCuId = null;
      updateDateSummaryBadge(currentDate);
      loadDayData(currentDate);
    }

    async function loadDayData(date) {
      loadStream(date);
      loadReviewQueue(date);
      loadGates(null, date);
    }

    async function loadStream(date) {
      try {
        const res = await fetch(`/api/l2a/today?date=${date}`);
        const data = await res.json();
        
        const actionCount = data.stream.filter(s => !s.is_empty_view).length;
        const emptyCount = data.stream.filter(s => s.is_empty_view).length;
        document.getElementById('stream-count').innerText = `${data.stream.length} 项 (拆解动作: ${actionCount}, 纯观点: ${emptyCount})`;
        
        const container = document.getElementById('l2a-stream-list');
        container.innerHTML = '';

        if (data.stream.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">该日期暂无消息窗口</div>';
          return;
        }

        data.stream.forEach(item => {
          const div = document.createElement('div');
          div.id = `cu-card-${item.cu_id}`;
          div.setAttribute('data-cu-id', item.cu_id);
          div.onclick = (e) => selectCu(item.cu_id, e);

          if (!item.parse_ok) {
            div.className = `card ${selectedCuId === item.cu_id ? 'active' : ''}`;
            div.innerHTML = `
              <div class="card-title">
                <span class="tag tag-failed">🚨 解析失败 (parse_ok=false)</span>
                <span style="color: var(--red); font-size: 11px;">${escapeHtml(item.cu_id)}</span>
              </div>
              <div style="color: var(--red); font-size: 11px;">${escapeHtml(item.raw_error)}</div>
              ${item.raw_text ? `
                <details style="margin-top: 6px;">
                  <summary style="font-size: 11px; color: var(--accent);">💬 展开原始对话</summary>
                  <pre style="white-space: pre-wrap; font-size: 11px; color: var(--text); margin-top: 4px;">${escapeHtml(item.raw_text)}</pre>
                </details>
              ` : ''}
            `;
          } else if (item.is_empty_view) {
            // W7: 纯观点/宏观空窗灰卡渲染
            div.className = `card card-empty-view ${selectedCuId === item.cu_id ? 'active' : ''}`;
            div.innerHTML = `
              <div class="card-title">
                <span style="color: var(--text-muted);">💬 仅观点 / 空窗 (无动作)</span>
                <span class="tag tag-empty-view">纯观点</span>
              </div>
              <div class="card-meta">CU: ${escapeHtml(item.cu_id)} | ${escapeHtml(item.et_session)} | 标签: ${escapeHtml((item.strategy_tags || []).join(', ') || '宏观/分析')}</div>
              ${item.raw_text ? `
                <details style="margin-top: 6px;">
                  <summary style="font-size: 11px; color: var(--text-muted);">💬 展开观点原文 (点击卡片联动右列)</summary>
                  <pre style="white-space: pre-wrap; font-size: 11px; color: var(--text); margin-top: 4px; max-height: 150px; overflow-y: auto;">${escapeHtml(item.raw_text)}</pre>
                </details>
              ` : ''}
            `;
          } else if (item.is_dismissed) {
            // 已忽略的计划单/观点转为灰卡展示，严禁再标“计划挂单”
            div.className = `card card-dismissed ${selectedCuId === item.cu_id ? 'active' : ''}`;
            div.innerHTML = `
              <div class="card-title">
                <span style="color: var(--text-muted); text-decoration: line-through;">${escapeHtml(item.action)} <strong>${escapeHtml(item.ticker)}</strong></span>
                <span class="tag tag-dismissed">已忽略 (dismissed)</span>
              </div>
              <div class="card-meta">CU: ${escapeHtml(item.cu_id)} | ${escapeHtml(item.instrument)} | 状态: 人工已忽略</div>
              <div style="font-size: 11px; color: var(--text-muted);">口播条件: ${escapeHtml(item.condition || '无')}</div>
              ${item.raw_text ? `
                <details style="margin-top: 6px;">
                  <summary style="font-size: 11px; color: var(--text-muted);">💬 展开原始对话 (已判定非实盘订单)</summary>
                  <pre style="white-space: pre-wrap; font-size: 11px; color: var(--text-muted); margin-top: 4px; max-height: 150px; overflow-y: auto;">${escapeHtml(item.raw_text)}</pre>
                </details>
              ` : ''}
            `;
          } else {
            const isFilled = item.status === 'filled_speech';
            const isVerified = item.is_verified || item.status === 'verified';
            div.className = `card ${selectedCuId === item.cu_id ? 'active' : ''}`;
            
            let tagHtml = `<span class="tag ${isFilled ? 'tag-speech-filled' : 'tag-planned'}">${isFilled ? '口述已成交' : '计划挂单'}</span>`;
            if (isVerified) {
              tagHtml = `<span class="tag tag-verified">✓ 人工已核准</span>`;
            }

            div.innerHTML = `
              <div class="card-title">
                <span>${escapeHtml(item.action)} <strong>${escapeHtml(item.ticker)}</strong> ${item.price ? '@ $' + item.price : ''}</span>
                ${tagHtml}
              </div>
              <div class="card-meta">CU: ${escapeHtml(item.cu_id)} | ${escapeHtml(item.instrument)} | 分数: ${escapeHtml(item.fraction || '未明')}</div>
              <div style="font-size: 11px; color: var(--text-muted);">口播条件: ${escapeHtml(item.condition || '无')}</div>
              <div style="font-size: 10px; color: #484f58; margin-top: 4px;">⏳ 券商 Fills: [等待真实流水对账]</div>
              ${item.raw_text ? `
                <details style="margin-top: 6px;">
                  <summary style="font-size: 11px; color: var(--accent);">💬 展开原文 (前200字)</summary>
                  <pre style="white-space: pre-wrap; font-size: 11px; color: var(--text); margin-top: 4px; max-height: 150px; overflow-y: auto;">${escapeHtml(item.raw_text)}</pre>
                </details>
              ` : ''}
            `;
          }
          container.appendChild(div);
        });
      } catch (e) {
        console.error("加载 L2a 流失败:", e);
      }
    }

    async function loadReviewQueue(date) {
      try {
        const res = await fetch(`/api/review/queue?date=${date}`);
        const data = await res.json();
        document.getElementById('queue-count').innerText = `${data.total_pending} 待审`;
        const container = document.getElementById('review-queue-list');
        container.innerHTML = '';

        if (data.queue.length === 0) {
          container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">当日无待审计划单 (已被成交覆盖或无计划)</div>';
          return;
        }

        data.queue.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.id = `card-${item.review_id}`;
          div.innerHTML = `
            <div class="card-title">
              <span><strong>${escapeHtml(item.ticker)}</strong> · ${escapeHtml(item.action)}</span>
              <span class="tag tag-planned">${escapeHtml(item.status)}</span>
            </div>
            <div class="card-meta">来源: ${escapeHtml(item.cu_id)} | ${escapeHtml(item.et_date)} (${escapeHtml(item.et_session)})</div>
            <div style="font-size: 12px; margin: 4px 0;">意图价: ${item.price ? '$' + item.price : '未指定'} | 仓位: ${escapeHtml(item.fraction || '常规')}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">口播条件: ${escapeHtml(item.condition || '无')}</div>
            ${item.raw_text ? `
              <details style="margin-top: 4px; margin-bottom: 6px;">
                <summary style="font-size: 11px; color: var(--accent);">💬 来源完整原文</summary>
                <pre style="white-space: pre-wrap; font-size: 11px; color: var(--text); margin-top: 4px; max-height: 120px; overflow-y: auto;">${escapeHtml(item.raw_text)}</pre>
              </details>
            ` : ''}
            <div class="btn-group">
              <button class="btn btn-ack" onclick="handleReviewAction('${item.review_id}', '${item.cu_id}', 'ack')">✓ 核准确认 (human_verified)</button>
              <button class="btn btn-dismiss" onclick="handleReviewAction('${item.review_id}', '${item.cu_id}', 'dismiss')">✕ 忽略 (dismiss)</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        console.error("加载待审池失败:", e);
      }
    }

    async function loadGates(cuId, date) {
      try {
        let url = '/api/l2b/gates';
        if (cuId) {
          url += `?cu_id=${encodeURIComponent(cuId)}`;
        } else if (date) {
          url += `?date=${encodeURIComponent(date)}`;
        }

        const res = await fetch(url);
        const data = await res.json();
        
        const isSingleCu = cuId && cuId !== 'ALL';
        document.getElementById('gates-scope-badge').innerText = isSingleCu 
          ? `当前 CU 命中 (${data.zhao_kid_badges.length})` 
          : `当日战法 (${data.zhao_kid_badges.length}条)`;
        
        const container = document.getElementById('l2b-gates-list');
        container.innerHTML = '';

        const zhaoSection = document.createElement('div');
        zhaoSection.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-weight: bold; color: #fff; font-size: 12px;">🏆 赵哥战法命中 (${data.zhao_kid_badges.length})</span>
            ${isSingleCu ? `<button onclick="loadGates(null, currentDate)" style="background: none; border: none; color: var(--accent); font-size: 11px; cursor: pointer;">显示全天</button>` : ''}
          </div>
        `;
        
        if (data.zhao_kid_badges.length === 0) {
          zhaoSection.innerHTML += `<div style="color: var(--text-muted); font-size: 11px; padding: 10px 0;">${isSingleCu ? '此 CU 未命中特定战法' : '当日无特定战法命中'}</div>`;
        }

        data.zhao_kid_badges.forEach(b => {
          const bDiv = document.createElement('div');
          bDiv.className = 'card';
          bDiv.style.marginBottom = '6px';
          bDiv.style.cursor = 'pointer';
          bDiv.title = '点击反跳定位左列源 CU 卡片并展开原文';
          bDiv.onclick = () => locateCuCard(b.cu_id);

          bDiv.innerHTML = `
            <div class="card-title">
              <span class="tag tag-kid">${escapeHtml(b.kid)}</span>
              <span style="font-size: 10px; color: var(--accent);">🔗 ${escapeHtml(b.cu_id)} (反跳)</span>
            </div>
            <div style="font-size: 11px; margin-top: 4px;">短语: <strong>${escapeHtml(b.matched_phrase)}</strong></div>
            <details open>
              <summary style="font-size: 11px; color: var(--accent);">连续证据 Span</summary>
              <p style="margin-top: 4px; color: var(--text); font-size: 11px;">${escapeHtml(b.evidence_span)}</p>
            </details>
          `;
          zhaoSection.appendChild(bDiv);
        });
        container.appendChild(zhaoSection);

        const mrzhouSection = document.createElement('details');
        mrzhouSection.open = false;
        mrzhouSection.innerHTML = `
          <summary style="color: var(--yellow); font-size: 12px;">🛡️ 周哥体制只读参考 (默认折叠·4体制+叠仓闸门)</summary>
          <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
            ${data.mrzhou_readonly_gates.gates.map(g => `
              <div style="padding: 6px; background: #1c2128; border: 1px solid var(--border); border-radius: 4px;">
                <div style="font-weight: bold; font-size: 11px; color: #58a6ff;">${escapeHtml(g.kid)}</div>
                <div style="font-size: 10px; color: var(--text-muted);">${escapeHtml(g.description)}</div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(mrzhouSection);

      } catch (e) {
        console.error("加载 L2b 闸门失败:", e);
      }
    }

    function selectCu(cuId, e) {
      selectedCuId = cuId;
      document.querySelectorAll('#l2a-stream-list .card').forEach(c => c.classList.remove('active'));
      const target = e ? e.currentTarget : document.getElementById(`cu-card-${cuId}`);
      if (target) target.classList.add('active');
      loadGates(cuId, currentDate);
    }

    // W7 附: 右列战法徽章反跳定位左列卡片
    function locateCuCard(cuId) {
      const card = document.getElementById(`cu-card-${cuId}`);
      if (card) {
        document.querySelectorAll('#l2a-stream-list .card').forEach(c => c.classList.remove('active', 'flash-highlight'));
        card.classList.add('active', 'flash-highlight');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const det = card.querySelector('details');
        if (det) det.open = true;
      }
      selectCu(cuId);
    }

    async function handleReviewAction(reviewId, cuId, decision) {
      try {
        const res = await fetch('/api/review/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ review_id: reviewId, cu_id: cuId, decision })
        });
        const data = await res.json();
        if (data.success) {
          const card = document.getElementById(`card-${reviewId}`);
          if (card) {
            // 平滑淡出后彻底从待审池 DOM 移除，避免尸卡占用中列
            card.style.transition = 'all 0.25s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(() => {
              card.remove();
              const queueList = document.getElementById('review-queue-list');
              const remaining = queueList.querySelectorAll('.card').length;
              document.getElementById('queue-count').innerText = `${remaining} 待审`;
              if (remaining === 0) {
                queueList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">当日无待审计划单 (已被成交覆盖或已审核)</div>';
              }
            }, 250);
          }
          
          // 🏛️ 全层级联动刷新：左列动作流、中列待审池、右列战法徽章、顶部水位状态徽章全部立即重新对齐
          await Promise.all([
            loadStream(currentDate),
            loadGates(selectedCuId, currentDate),
            updateIncrementalStatus()
          ]);
        }
      } catch (e) {
        alert("操作失败: " + e.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.onload = initWorkbench;
  </script>
</body>
</html>
