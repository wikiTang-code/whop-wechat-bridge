# 交互式点位 K 线图配置 (Interactive Level Chart Configuration)

# 默认标的列表（包含大盘 ETF、杠杆 ETF 及 DEFAULT_MATRIX 全量）
default_symbols:
  - SPY
  - QQQ
  - SPX
  - SPXL
  - TSLA
  - NBIS
  - IREN
  - CRWV
  - CIFR
  - CBRS
  - RIOT
  - AEHR
  - PL
  - INTC
  - NOK
  - WDC
  - GLW
  - AKAM
  - OKLO
  - ONDS
  - MU
  - COHR
  - SOXL
  - COIN
  - NVDA
  - LITE
  - SOXX
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - META
  - SPCX

# 行情数据源配置
market_data:
  provider: yfinance # 选用 yfinance: 独立无外部服务依赖，Windows/Linux 开箱即用
  symbol_map:
    SPX: "^GSPC"     # yfinance 中标普500指数代码映射
  periods:
    daily:
      period: "3mo"
      interval: "1d"
    hourly:
      period: "1mo"
      interval: "1h"

# GEX 关键点位数据源配置
gex:
  enabled: true
  snapshot_path: "data/gex/snapshot_20261111_081039.json" # 优先读此路径，若无自动回退 20261111 目录
  fallback_paths:
    - "data/gex/20261111/snapshot_20261111_081039.json"
    - "C:\\Users\\86597\\.gemini\\antigravity\\scratch\\level-chart-20261111\\snapshot_20261111_081039.json"

# 外部专家/KOL点位数据源 (通过 LevelSource 协议解耦，可扩展 API / JSON / Markdown)
level_sources:
  bodongge:
    enabled: true
    provider: markdown_file # 可替换为 api 或 json_file
    path: "C:\\Users\\86597\\.gemini\\antigravity\\scratch\\level-chart-20261111\\stockrocks-波动哥.md"
    fallback_paths:
      - "C:\\Users\\86597\\.gemini\\antigravity\\scratch\\level-chart-20261111\\bodongge-latest-20261109.md"
    target_symbol: "SPX"

# SPXL 3倍杠杆非线性映射参数
# 公式: SPXL = base_spxl * (1 + factor * (SPX / base_spx - 1))
spxl_mapping:
  enabled: true
  base_spxl: 246.75
  base_spx: 7376.86
  factor: 3.0
  # 关键映射基准抽样点（在 SPXL 图上直观展示）
  reference_points:
    - spx: 7376.86
      label: "基准锚点"
    - spx: 7520.93
      label: "SPX当前KING/现价锚点"
    - spx: 7600.0
      label: "SPX上方FLOOR强阻力锚点"

# 手动自定义点位配置 (随时追加监控点)
manual_levels:
  SPX: []
  SPY: []
  QQQ: []
  SPXL: []
  NVDA: []

# 输出配置
output:
  dir: "C:\\Users\\86597\\.gemini\\antigravity\\scratch\\level-chart-20261111\\out"
  export_png: true
